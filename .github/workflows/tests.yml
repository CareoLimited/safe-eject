name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The oldest Python SafeEject supports is the one macOS ships with
      - name: Python tests (macOS system Python)
        run: /usr/bin/python3 --version && /usr/bin/python3 -m unittest discover tests/
      - name: Python tests (latest Python)
        run: python3 --version && python3 -m unittest discover tests/
      - name: Dashboard tests
        run: node tests/test_app.js
